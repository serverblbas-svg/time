<div id="weather-widget" style="font-family: Tahoma, sans-serif; display: inline-flex; align-items: center; gap: 15px; font-size: 18px; color: #ffffff; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);">
    <div style="display: inline-flex; align-items: center; gap: 5px;">
        <span>🌙</span>
        <span id="hijri-date">دەبارێت...</span>
    </div>
    <span style="color: rgba(255, 255, 255, 0.7);">|</span>
    <div style="display: inline-flex; align-items: center; gap: 5px;">
        <span id="weather-icon">🌤️</span>
        <span id="weather-text">هەولێر: 31°C (ساماڵ)</span>
    </div>
</div>

<script>
// وەرگرتنی بەرواری هیجری بە شێوەی خۆکار
function updateHijriDate() {
    try {
        const options = { calendar: 'islamic-umalqura', day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
        const formatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', options);
        const parts = formatter.formatToParts(new Date());
        
        let dayName = '', dayNum = '', monthName = '', yearNum = '';
        
        parts.forEach(part => {
            if (part.type === 'weekday') dayName = part.value;
            if (part.type === 'day') dayNum = part.value;
            if (part.type === 'month') monthName = part.value;
            if (part.type === 'year') yearNum = part.value;
        });

        // گۆڕینی ناوە عەربییەکانی مانگەکان بۆ کوردی یان شێوازی داواکراو ئەگەر پێویست بکات
        document.getElementById('hijri-date').innerText = `${dayName} ${dayNum}-${monthName}-${yearNum}`;
    } catch (e) {
        // یەدەگ ئەگەر وێبگەڕەکە پشتگیری نەکات
        document.getElementById('hijri-date').innerText = "دووشەممە ١٧-ربیع الاخر-١٤٤٨";
    }
}

async function fetchWeather() {
    try {
        // وەرگرتنی شوێن بە پێی IP
        const ipRes = await fetch('https://ipapi.co/json/');
        const ipData = await ipRes.json();
        const lat = ipData.latitude || 36.1901; 
        const lon = ipData.longitude || 44.0091; 
        const cityName = ipData.city || "هەولێر";

        // وەرگرتنی کەشوهەوا لە API ی فەرمی و بێبەرامبەر
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const weatherData = await weatherRes.json();
        
        const temp = Math.round(weatherData.current_weather.temperature) || 31;
        const wCode = weatherData.current_weather.weathercode;
        let condition = "ساماڵ";
        let icon = "🌤️";
        
        if (wCode > 0 && wCode < 4) {
            condition = "نیمچە هەور";
            icon = "⛅";
        } else if (wCode >= 50) {
            condition = "باراناوی";
            icon = "🌧️";
        }

        document.getElementById('weather-text').innerText = `${cityName}: ${temp}°C (${condition})`;
        document.getElementById('weather-icon').innerText = icon;
    } catch (error) {
        document.getElementById('weather-text').innerText = "هەولێر: 31°C (ساماڵ)";
    }
}

// جێبەجێکردنی فەنکشنەکان لە سەرەتادا
updateHijriDate();
fetchWeather();

// نوێکردنەوەی کەشوهەوا هەموو ٥ خولەک جارێک
setInterval(fetchWeather, 300000);
</script>
