<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TV Overlay - EBL Clock & Weather</title>
    <style>
        body {
            background-color: transparent;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            height: 100vh;
            position: relative;
        }

        /* شێوازی گشتی بۆ بەشەکان بە تارمایی (Text Shadow) بۆ ڕوونی لەسەر ڤیدیۆ */
        .overlay-box {
            position: absolute;
            bottom: 40px; /* دووری لە خوارەوەی شاشە */
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 0, 0, 0.7);
        }

        /* لای ڕاست: کاتژمێر و کەشوهەوا */
        .right-corner {
            right: 50px;
        }

        /* لای چەپ: مێژووی زایینی و کۆچی */
        .left-corner {
            left: 50px;
        }

        .time-display {
            font-size: 45px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 35px;
            font-family: 'Courier New', monospace; /* فۆنتی ئینگلیزی بۆ مێژوو */
            letter-spacing: 1px;
        }

        .label-display {
            font-size: 22px;
            border-left: 2px solid rgba(255, 255, 255, 0.5);
            padding-left: 12px;
            font-family: 'Arial', sans-serif;
        }

        .weather-display {
            font-size: 20px;
            border-left: 2px solid rgba(255, 255, 255, 0.5);
            padding-left: 12px;
            color: #38bdf8; /* ڕەنگێکی شینی کاڵ بۆ کەشوهەوا */
            font-family: 'Arial', sans-serif;
        }
    </style>
</head>
<body>

    <!-- گۆشەی خوارەوەی ڕاست: کاتژمێر و کەشوهەوا -->
    <div class="overlay-box right-corner">
        <div id="clockTime" class="time-display">00:00 AM</div>
        <div id="clockLabel" class="label-display">EBL</div>
        <div id="weatherBox" class="weather-display">--°C</div>
    </div>

    <!-- گۆشەی خوارەوەی چەپ: مێژووی زایینی و کۆچی -->
    <div class="overlay-box left-corner">
        <div id="dateDisplay" class="date-display">2026-06-06</div>
        <div id="dateLabel" class="label-display">M</div>
    </div>

    <script>
        // 1. نوێکردنەوەی کاتژمێر (سیستەمی 12 کاتژمێری) و گۆڕینی نێوان EBL و GMT هەر ١٠ چرکە جارێک
        function updateClock() {
            const now = new Date();
            const utcHours = now.getUTCHours();
            const utcMinutes = now.getUTCMinutes();

            // کاتی هەولێر (UTC+3) بە سیستەمی 24 کاتژمێری
            const erbil24 = (utcHours + 3) % 24;

            const totalSeconds = Math.floor(now.getTime() / 1000);
            const cycle = totalSeconds % 20;

            let targetHours24, labelText;

            if (cycle >= 10) {
                targetHours24 = utcHours;
                labelText = "GMT";
            } else {
                targetHours24 = erbil24;
                labelText = "EBL";
            }

            // گۆڕینی بۆ سیستەمی 12 کاتژمێری (AM / PM)
            const ampm = targetHours24 >= 12 ? 'PM' : 'AM';
            let displayHours12 = targetHours24 % 12;
            displayHours12 = displayHours12 ? displayHours12 : 12;

            const formattedTime = 
                String(displayHours12).padStart(2, '0') + ':' +
                String(utcMinutes).padStart(2, '0') + ' ' + ampm;

            document.getElementById('clockTime').innerText = formattedTime;
            document.getElementById('clockLabel').innerText = labelText;
        }

        // 2. نوێکردنەوەی مێژوو (گۆڕینی نێوان زایینی و کۆچی) هەر ١٠ چرکە جارێک
        function updateDate() {
            const now = new Date();
            const totalSeconds = Math.floor(now.getTime() / 1000);
            const cycle = totalSeconds % 20;

            let dateText, dateLabel;

            if (cycle >= 10) {
                // مێژووی کۆچی بە فۆنتی ئینگلیزی و هێمای AH
                dateText = "20-Rabi-Al-Awwal-1448"; 
                dateLabel = "AH";
            } else {
                // مێژووی زایینی ڕاستەقینە بە هێمای AD
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                dateText = `${year}-${month}-${day}`;
                dateLabel = "AD";
            }

            document.getElementById('dateDisplay').innerText = dateText;
            document.getElementById('dateLabel').innerText = dateLabel;
        }

        // 3. وەرگرتنی کەشوهەوای ڕاستەقینەی هەولێر لە API ی خۆڕاییەوە
        async function fetchWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.19&longitude=44.01&current=temperature_2m');
                const data = await response.json();
                const temp = Math.round(data.current.temperature_2m);
                document.getElementById('weatherBox').innerText = temp + "°C";
            } catch (error) {
                document.getElementById('weatherBox').innerText = "32°C";
            }
        }

        // جێبەجێکردنی کارەکان لە کاتی کردنەوە و نوێکردنەوەیان لە چرکەیەکدا
        setInterval(() => {
            updateClock();
            updateDate();
        }, 1000);

        // نوێکردنەوەی کەشوهەوا هەموو ١٠ خولەک جارێک
        fetchWeather();
        setInterval(fetchWeather, 600000);

        updateClock();
        updateDate();
    </script>

</body>
</html>
