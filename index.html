<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SPI TV HD - Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Noto+Naskh+Arabic:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent;
            color: #ffffff;
            font-family: 'Amiri', 'Noto Naskh Arabic', 'Tahoma', sans-serif;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
           ترانزیشنی ڕەش و سپی (سادە)
           ============================================================ */
        .scanline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.03) 0px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(255, 255, 255, 0.01) 2px,
                rgba(255, 255, 255, 0.01) 4px
            );
            animation: scanlineMove 8s linear infinite;
        }

        @keyframes scanlineMove {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 0 100%;
            }
        }

        /* ============================================================
           هەموو ئەو بۆکسانەی کە ناوەڕۆک لەخۆدەگرن
           ============================================================ */
        .overlay-box {
            position: absolute;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.7);
        }

        /* 📺 ناوی کەناڵ */
        .top-left {
            top: 20px;
            left: 40px;
        }

        .channel-logo {
            font-family: 'Amiri', 'Noto Naskh Arabic', serif;
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 24px;
            border-radius: 12px;
            border-right: 4px solid #ffd700;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }

        /* 📅 مێژوو */
        .bottom-left {
            bottom: 40px;
            left: 50px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .date-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.45);
            padding: 8px 20px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .date-display {
            font-family: 'Amiri', 'Noto Naskh Arabic', serif;
            font-size: 30px;
            font-weight: 700;
            color: #fff;
        }

        .date-label {
            font-family: 'Amiri', 'Noto Naskh Arabic', serif;
            font-size: 20px;
            color: #ffd700;
            border-right: 2px solid rgba(255, 255, 255, 0.2);
            padding-right: 14px;
        }

        /* 🕐 کاتژمێر */
        .bottom-right {
            bottom: 40px;
            right: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .clock-box {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.45);
            padding: 8px 20px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 44px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
        }

        .time-label {
            font-family: 'Amiri', 'Noto Naskh Arabic', serif;
            font-size: 20px;
            color: #ffd700;
            border-right: 2px solid rgba(255, 255, 255, 0.2);
            padding-right: 14px;
        }

        .weather-display {
            font-family: 'Amiri', 'Noto Naskh Arabic', serif;
            font-size: 22px;
            color: #4fc3f7;
            border-right: 2px solid rgba(255, 255, 255, 0.2);
            padding-right: 14px;
        }

        /* 🕌 کاتی نوێژ */
        .prayer-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 215, 0, 0.10);
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            font-family: 'Amiri', 'Noto Naskh Arabic', serif;
            font-size: 17px;
            color: #ffd700;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        .prayer-badge .time {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            min-width: 75px;
            text-align: center;
        }

        .prayer-badge .name {
            font-size: 16px;
            color: #ffd700;
        }

        /* ============================================================
           📱 مۆبایل
           ============================================================ */
        @media (max-width: 768px) {
            .top-left { top: 12px; left: 16px; }
            .channel-logo { font-size: 28px; padding: 4px 16px; }
            .bottom-left { bottom: 16px; left: 16px; gap: 6px; }
            .bottom-right { bottom: 16px; right: 16px; gap: 8px; }
            .clock-box { padding: 4px 14px; gap: 10px; flex-wrap: wrap; }
            .time-display { font-size: 30px; }
            .date-display { font-size: 22px; }
            .date-label { font-size: 16px; }
            .time-label { font-size: 16px; }
            .weather-display { font-size: 18px; }
            .prayer-badge { font-size: 14px; padding: 3px 12px; }
            .prayer-badge .time { font-size: 16px; min-width: 60px; }
            .prayer-badge .name { font-size: 13px; }
        }

        @media (max-width: 480px) {
            .time-display { font-size: 24px; }
            .date-display { font-size: 18px; }
            .channel-logo { font-size: 20px; padding: 3px 12px; }
            .prayer-badge .time { font-size: 13px; min-width: 50px; }
            .prayer-badge .name { font-size: 11px; }
            .prayer-badge { padding: 2px 10px; }
            .clock-box { padding: 4px 10px; gap: 6px; }
            .date-box { padding: 4px 12px; }
        }
    </style>
</head>

        const PRAYER_NAMES = [
            { id: 'fajr', name: 'بەیانی' },
            { id: 'sunrise', name: 'خۆرهەڵاتن' },
            { id: 'dhuhr', name: 'نیوەڕۆ' },
            { id: 'asr', name: 'عەسر' },
            { id: 'maghrib', name: 'ئێوارە' },
            { id: 'isha', name: 'خەوتنان' }
        ];

        function getPrayerTimes(date) {
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const key = `${month}_${day}`;
            const data = PRAYER_DATA[key];
            if (!data) return null;
            const times = data.split('|');
            return times.map(t => {
                const parts = t.split(':');
                return { hours: parseInt(parts[0]), minutes: parseInt(parts[1]) };
            });
        }

        function updatePrayerBadge() {
            const now = new Date();
            const times = getPrayerTimes(now);
            if (!times) {
                document.getElementById('prayerTime').textContent = '--:--:--';
                return;
            }

            let nextIndex = -1;
            let nextTime = null;

            for (let i = 0; i < times.length; i++) {
                const t = new Date(now);
                t.setHours(times[i].hours, times[i].minutes, 0, 0);
                if (t > now) {
                    nextIndex = i;
                    nextTime = t;
                    break;
                }
            }

            if (!nextTime) {
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const tomTimes = getPrayerTimes(tomorrow);
                if (tomTimes) {
                    const t = new Date(now);
                    t.setDate(t.getDate() + 1);
                    t.setHours(tomTimes[0].hours, tomTimes[0].minutes, 0, 0);
                    nextIndex = 0;
                    nextTime = t;
                }
            }

            const nameEl = document.getElementById('prayerName');
            const timeEl = document.getElementById('prayerTime');

            if (nextTime && nextIndex >= 0) {
                const diff = Math.floor((nextTime - now) / 1000);
                nameEl.textContent = PRAYER_NAMES[nextIndex].name;

                if (diff <= 0) {
                    timeEl.textContent = 'ئێستا!';
                    timeEl.style.color = '#ffd700';
                } else {
                    const h = Math.floor(diff / 3600);
                    const m = Math.floor((diff % 3600) / 60);
                    const s = diff % 60;
                    timeEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                    timeEl.style.color = '#ffffff';
                }
            } else {
                timeEl.textContent = '--:--:--';
            }
        }

        function updateClock() {
            const now = new Date();
            const utcHours = now.getUTCHours();
            const utcMinutes = now.getUTCMinutes();
            const erbil24 = (utcHours + 3) % 24;
            const totalSeconds = Math.floor(now.getTime() / 1000);
            const cycle = totalSeconds % 20;

            let targetHours24, labelText;
            if (cycle >= 10) {
                targetHours24 = utcHours;
                labelText = "GMT";
            } else {
                targetHours24 = erbil24;
                labelText = "EBL";
            }

            const ampm = targetHours24 >= 12 ? 'PM' : 'AM';
            let displayHours12 = targetHours24 % 12;
            displayHours12 = displayHours12 ? displayHours12 : 12;

            const formattedTime = 
                String(displayHours12).padStart(2, '0') + ':' +
                String(utcMinutes).padStart(2, '0') + ' ' + ampm;

            document.getElementById('clockTime').innerText = formattedTime;
            document.getElementById('clockLabel').innerText = labelText;
        }

        function updateDate() {
            const now = new Date();
            const totalSeconds = Math.floor(now.getTime() / 1000);
            const cycle = totalSeconds % 20;

            let dateText, dateLabel;
            if (cycle >= 10) {
                dateText = "٢٠ - ربيع الاول - ١٤٤٨";
                dateLabel = "هـ";
            } else {
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                dateText = `${year}/${month}/${day}`;
                dateLabel = "م";
            }

            document.getElementById('dateDisplay').innerText = dateText;
            document.getElementById('dateLabel').innerText = dateLabel;
        }

        async function fetchWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.19&longitude=44.01&current=temperature_2m');
                const data = await response.json();
                const temp = Math.round(data.current.temperature_2m);
                document.getElementById('weatherBox').innerText = temp + "°C";
            } catch (error) {
                document.getElementById('weatherBox').innerText = "32°C";
            }
        }

        // ============================================================
        // 🚀 دەستپێکردن
        // ============================================================
        setInterval(() => {
            updateClock();
            updateDate();
            updatePrayerBadge();
        }, 1000);

        fetchWeather();
        setInterval(fetchWeather, 600000);

        updateClock();
        updateDate();
        updatePrayerBadge();

        console.log('🐱 SPI TV HD - وەشانی سادە (ترانزیشنی ڕەش و سپی)');
    </script>

</body>
</html>
